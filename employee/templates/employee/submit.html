<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle Réclamation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: #f5f4f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
            color: #0f0f14;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e5e4e0;
            border-radius: 5px;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }
        button {
            background: #e84545;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
        }
        button:hover {
            opacity: 0.85;
        }
        .btn-back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
        }
        .alert {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .alert-success {
            background: #dcfce7;
            color: #15803d;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="{% url 'employee_dashboard' %}" class="btn-back">← Retour au tableau de bord</a>
    
    <h1 style="margin-bottom: 20px;">📝 Nouvelle Réclamation</h1>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
    {% endif %}
    
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Titre:</label>
            <input type="text" name="title" placeholder="Titre de votre réclamation" required>
        </div>
        
        <div class="form-group">
            <label>Catégorie (optionnel):</label>
            <label for="category">Choisir une catégorie :</label>
                <select name="category" id="category" >
                    <option value="">-- Sélectionnez une catégorie --</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.nom }}</option>
                    {% endfor %}
                </select>
        </div>
        
        <div class="form-group">
            <label>Description:</label>
            <textarea name="description" rows="5" placeholder="Décrivez votre problème en détail..." required></textarea>
        </div>
        
        <div class="form-group">
            <label>Pièce jointe (optionnel):</label>
            <input type="file" name="attachment">
            <small style="color: #6b7280; display: block; margin-top: 5px;">Formats acceptés: PDF, JPG, PNG, DOC</small>
        </div>
        
        <button type="submit">📤 Soumettre ma réclamation</button>
    </form>
</div>

</body>
</html>
