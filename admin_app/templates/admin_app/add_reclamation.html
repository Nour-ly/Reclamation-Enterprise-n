{% extends 'admin_app/base.html' %}

{% block title %}Créer une réclamation — Reclaim{% endblock %}

{% block extra_css %}
<style>
    .btn-back { display: inline-block; margin-bottom: 1.5rem; color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
    .btn-back:hover { color: var(--ink); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem; max-width: 750px; }
    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; color: var(--ink); }
    input[type="text"], select, textarea { width: 100%; background: var(--card); border: 1.5px solid var(--border); border-radius: 8px; padding: 0.8rem 1rem; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; color: var(--ink); outline: none; transition: all 0.2s; }
    input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    textarea { height: 120px; resize: vertical; }
    .btn-submit { width: 100%; background: var(--ink); color: #fff; border: none; padding: 1rem; border-radius: 8px; font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; margin-top: 0.5rem; }
    .btn-submit:hover { opacity: 0.9; }
</style>
{% endblock %}

{% block content %}
<a href="{% url 'reclamation_list' %}" class="btn-back">← Retour aux réclamations</a>

<div class="card">
    <h1 style="margin-bottom: 1.5rem; font-size: 1.7rem;">Ajouter une réclamation</h1>
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="title">Titre / Objet</label>
            <input type="text" id="title" name="title" required placeholder="Ex: Problème de connexion VPN...">
        </div>

        <div class="form-group">
            <label for="description">Description détaillée</label>
            <textarea id="description" name="description" required placeholder="Détaillez le problème rencontré ici..."></textarea>
        </div>

        <div class="form-group">
            <label for="user">Attribuer à l'employé</label>
            <select id="user" name="user">
                {% for u in users %}
                    <option value="{{ u.id }}">{{ u.username }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="category">Catégorie</label>
            <select id="category" name="category">
                {% for c in categories %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn-submit">Soumettre la réclamation →</button>
    </form>
</div>
{% endblock %}
