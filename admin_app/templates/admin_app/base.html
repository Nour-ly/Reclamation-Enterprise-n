<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Administration — Reclaim{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0f0f14;
            --surface: #f5f4f0;
            --card: #ffffff;
            --accent: #e84545;
            --accent2: #2563eb;
            --muted: #6b7280;
            --border: #e5e4e0;
            --sidebar-width: 260px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--surface);
            color: var(--ink);
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR FIXE À GAUCHE */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--ink);
            color: #fff;
            padding: 2.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 0; bottom: 0; left: 0;
            z-index: 100;
        }
        .brand-logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.02em;
            margin-bottom: 3rem;
        }
        .brand-logo span { color: var(--accent); }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-grow: 1;
        }
        .nav-link {
            display: flex;
            align-items: center;
            padding: 0.8rem 1rem;
            color: #8888a0;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }
        /* Classe active si on est sur la page */
        .nav-link.active {
            background: var(--accent);
            color: #fff;
            font-weight: 700;
        }

        .sidebar-footer {
            border-top: 1px solid #222230;
            padding-top: 1.5rem;
        }
        .btn-logout {
            color: #6b6b80;
            text-decoration: none;
            font-size: 0.85rem;
            display: inline-block;
            transition: color 0.2s;
        }
        .btn-logout:hover { color: var(--accent); }

        /* ZONE DE CONTENU PRINCIPAL */
        .main-content {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 3rem;
            max-width: 1200px;
            width: calc(100% - var(--sidebar-width));
        }

        /* STYLES GENERAUX POUR SES COMPOSANTS */
        h1, h2, h3 { font-family: 'Syne', sans-serif; font-weight: 800; letter-spacing: -0.02em; }
        .page-header { margin-bottom: 2.5rem; }
        .page-header p { color: var(--muted); font-size: 0.95rem; margin-top: 0.3rem; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="brand-logo">Reclaim<span>.</span></div>
            <nav class="nav-menu">
                <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    📊 Vue d'ensemble
                </a>
                <a href="{% url 'users_list' %}" class="nav-link {% if request.resolver_match.url_name == 'users_list' %}active{% endif %}">
                    👥 Utilisateurs
                </a>
                <a href="{% url 'reclamation_list' %}" class="nav-link {% if request.resolver_match.url_name == 'reclamation_list' %}active{% endif %}">
                    📁 Réclamations
                </a>
                <a href="{% url 'category_list' %}" class="nav-link {% if request.resolver_match.url_name == 'category_list' %}active{% endif %}">
                    🏷️ Catégories
                </a>
            </nav>
        </div>
        <div class="sidebar-footer">
            <a href="/logout/" class="btn-logout">🚪 Se déconnecter</a>
        </div>
    </div>

    <div class="main-content">
        {% if messages %}
            {% for message in messages %}
                <div style="background: #d1e7dd; color: #0f5132; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
